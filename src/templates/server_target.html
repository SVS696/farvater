<div class="columns"><label>IP или имя сервера<input name="target_host" value="{{ target.get('host','') }}" placeholder="server.example.com"></label><label>Порт SSH<input name="target_port" type="number" min="1" max="65535" value="{{ target.get('port',22) }}"></label></div>
<label>Пользователь SSH<input name="target_username" value="{{ target.get('username','') }}" autocomplete="off"></label>
<details><summary>Отдельный ключ SSH</summary><label>Путь к ключу на машине панели<input name="target_identity_file" value="{{ target.get('identity_file','') }}" placeholder="Пусто — ключи пользователя панели"></label></details>
<div class="actions"><button type="button" class="secondary small" data-server-target-up>Выше</button><button type="button" class="secondary small" data-server-target-down>Ниже</button><button type="button" class="secondary small" data-server-target-remove>Удалить адрес</button><button type="button" class="drag-handle secondary small" draggable="true" data-server-target-drag aria-label="Перетащить адрес">⠿</button></div>
