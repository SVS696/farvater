<div class="columns"><label>Выход<select name="exit" aria-describedby="help-rule-exit" required>{% if not is_default and not profile.get('id') %}<option value="" selected disabled>Выберите выход</option>{% endif %}{% for key,value in policy.exits.items() if not is_default or value.scope=='public' %}<option value="{{ key }}" {% if profile.get('exit')==key %}selected{% endif %}>{{ value.name }}</option>{% endfor %}</select>{{ field_help('help-rule-exit','Основной путь для совпавшего трафика. Если он недоступен, пробуются резервные пары в указанном порядке.') }}</label>
<label>DNS<select name="dns" aria-describedby="help-rule-dns" required>{% if not is_default and not profile.get('id') %}<option value="" selected disabled>Выберите DNS</option>{% endif %}{% for key,value in policy.dns.items() if not is_default or (value.scope=='public' and value.get('native',{}).get('type')!='fakeip') %}<option value="{{ key }}" {% if profile.get('dns')==key %}selected{% endif %}>{{ value.name }}</option>{% endfor %}</select>{{ field_help('help-rule-dns','Этот профиль разрешает имена в рамках правила. При переходе на резерв переключаются вместе выход и DNS.') }}</label></div>
