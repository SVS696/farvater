name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable:
    name: Python tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Get verified native core for local-node integration
        shell: bash
        run: |
          python tools/download_core.py --destination "$RUNNER_TEMP/farvater-core"
          printf 'FARVATER_TEST_CORE=%s\n' "$RUNNER_TEMP/farvater-core/sing-box" >> "$GITHUB_ENV"
      - name: Application tests
        run: python -m unittest discover -s src -p 'test_*.py'
      - name: Installation tests
        run: python -m unittest discover -s install -p 'test_*.py'
      - name: Portable launcher tests
        run: python -m unittest discover -s tools -p 'test_*.py'
