<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img">
<title>Две машины — одна цепочка</title>
<desc>Схема настройки: адреса относятся к примеру из инструкции. Запрос к A:2081 проверяет правило и цепочку. Запрос к A:12081 проверяет только SSH → B.</desc>
<rect width="1080" height="430" rx="18" fill="#14201c"/>
<text x="40" y="55" font-family="sans-serif" font-size="27" font-weight="700" fill="#eef5ef">Две машины — одна цепочка</text>
<text x="40" y="87" font-family="sans-serif" font-size="16" fill="#b0c6b8">Схема настройки: адреса относятся к примеру из инструкции.</text>
<rect x="40" y="120" width="310" height="225" rx="12" fill="#22372d" stroke="#537864"/>
<text x="60" y="157" font-family="sans-serif" font-size="21" font-weight="700" fill="#b8e3c5">Машина A</text>
<text x="60" y="197" font-family="sans-serif" font-size="17" fill="#eef5ef">Приложение → 2081</text>
<text x="60" y="228" font-family="sans-serif" font-size="17" fill="#eef5ef">Правило example.com</text>
<text x="60" y="259" font-family="sans-serif" font-size="17" fill="#eef5ef">Выход: Узел B</text>
<path d="M 355 225 h 23 l -7 -6 m 7 6 l -7 6" fill="none" stroke="#b8e3c5" stroke-width="2"/>
<rect x="385" y="120" width="310" height="225" rx="12" fill="#22372d" stroke="#537864"/>
<text x="405" y="157" font-family="sans-serif" font-size="21" font-weight="700" fill="#b8e3c5">SSH-туннель</text>
<text x="405" y="197" font-family="sans-serif" font-size="17" fill="#eef5ef">A: 127.0.0.1:12081</text>
<text x="405" y="228" font-family="sans-serif" font-size="17" fill="#eef5ef">Зашифрованный канал</text>
<text x="405" y="259" font-family="sans-serif" font-size="17" fill="#eef5ef">B: 127.0.0.1:2081</text>
<path d="M 700 225 h 23 l -7 -6 m 7 6 l -7 6" fill="none" stroke="#b8e3c5" stroke-width="2"/>
<rect x="730" y="120" width="310" height="225" rx="12" fill="#22372d" stroke="#537864"/>
<text x="750" y="157" font-family="sans-serif" font-size="21" font-weight="700" fill="#b8e3c5">Машина B</text>
<text x="750" y="197" font-family="sans-serif" font-size="17" fill="#eef5ef">Собственное ядро</text>
<text x="750" y="228" font-family="sans-serif" font-size="17" fill="#eef5ef">Собственная политика</text>
<text x="750" y="259" font-family="sans-serif" font-size="17" fill="#eef5ef">Выход B → Интернет</text>
<text x="40" y="388" font-family="sans-serif" font-size="16" fill="#b0c6b8">Запрос к A:2081 проверяет правило и цепочку. Запрос к A:12081 проверяет только SSH → B.</text>
</svg>